apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shoe
spec:
  ingressClassName: traefik
  rules:
    - host: shoe.test
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
